name: Challenge submissions

on:
  pull_request:
    branches: [main]
    paths:
      - 'submissions/*.json'
  push:
    branches: [main]
    paths:
      - 'submissions/*.json'
      - 'challenge/**'

permissions:
  contents: read

jobs:
  check:
    # A pull request that adds layout files: every file must be valid; the scores go to the job summary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - name: Score the changed files and attach optional diagnostics
        env:
          CHALLENGE_BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          changed = subprocess.check_output([
              "git", "diff", "--name-only", "-z", "--diff-filter=AM",
              f"origin/{os.environ['CHALLENGE_BASE_REF']}...HEAD", "--", "submissions/*.json",
          ]).decode("utf-8").split("\0")
          files = [p for p in changed if p and Path(p).name != "leaderboard.json"]
          if not files:
              print("No layout files changed.")
              raise SystemExit(0)
          diagnostic_dir = "work/evaluator-experiments/pr-check"
          checked = subprocess.run([
              sys.executable, "-m", "bangla_dh", "leaderboard", "--check",
              "--diagnostics", diagnostic_dir, *files,
          ], capture_output=True, text=True)
          print(checked.stdout, end="")
          print(checked.stderr, end="", file=sys.stderr)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("### Official scores\n\n```text\n")
              stream.write(checked.stdout.replace(chr(96) * 3, "[code fence]") + "\n```\n\n")
              report = Path(diagnostic_dir) / "REPORT.md"
              if report.is_file():
                  stream.write(report.read_text(encoding="utf-8"))
              else:
                  stream.write("Optional diagnostics unavailable. Official scoring decides this check.\n")
          raise SystemExit(checked.returncode)
          PY

  leaderboard:
    # After a merge: rebuild the leaderboard files from everything in submissions/.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - name: Rebuild the leaderboard
        run: python -m bangla_dh leaderboard
      - name: Commit the leaderboard when it changed
        run: |
          if git diff --quiet -- submissions/LEADERBOARD.md submissions/leaderboard.json; then echo "Leaderboard unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/LEADERBOARD.md submissions/leaderboard.json
          git commit -m "Rebuild the challenge leaderboard"
          git push
