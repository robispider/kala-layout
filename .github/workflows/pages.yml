name: Publish bilingual site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'translations/**'
      - 'challenge/**'
      - 'submissions/**'
      - 'site/**'
      - 'data/evaluators/**'
      - 'results/evaluator-e1/**'
      - 'results/evaluator-e2/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'translations/**'
      - 'challenge/**'
      - 'submissions/**'
      - 'site/**'
      - 'data/evaluators/**'
      - 'results/evaluator-e1/**'
      - 'results/evaluator-e2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: kala-layout-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Check translations and build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
