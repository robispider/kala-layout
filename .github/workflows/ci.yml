name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/usage-metric-dataset/sessions/**'
      - 'data/usage-metric-dataset/manifest.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and regression tests
        run: python -m unittest discover -s tests
      - name: Published results are internally consistent
        run: python -m bangla_dh check-results
      - name: The public scorer runs on its own
        run: |
          python challenge/bangla_dh_challenge.py --public
          python challenge/bangla_dh_challenge.py challenge/D-reference.json challenge/A-reference.json
      - name: The search reproduces the published Kala Jhor in a short run
        run: python -m bangla_dh generate-layout --style D --seeds 2 --workers 2 --out work/ci
