name: Received typing-study data

on:
  push:
    branches: [main]
    paths:
      - 'data/usage-metric-dataset/**'
      - 'src/bangla_dh/usage_metric.py'
      - 'src/bangla_dh/usage_*.py'
      - 'src/bangla_dh/cli.py'
      - 'src/bangla_dh/paths.py'
      - 'data/unicode/**'
      - 'data/usage-metric-registry/**'
      - 'data/usage-metric-policy-v1.json'
      - 'tests/test_usage_metric.py'
      - 'tests/test_usage_pipeline.py'
      - 'tests/test_usage_evaluator.py'
      - '.github/workflows/usage-data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/usage-metric-dataset/**'
      - 'src/bangla_dh/usage_metric.py'
      - 'src/bangla_dh/usage_*.py'
      - 'src/bangla_dh/cli.py'
      - 'src/bangla_dh/paths.py'
      - 'data/unicode/**'
      - 'data/usage-metric-registry/**'
      - 'data/usage-metric-policy-v1.json'
      - 'tests/test_usage_metric.py'
      - 'tests/test_usage_pipeline.py'
      - 'tests/test_usage_evaluator.py'
      - '.github/workflows/usage-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.10'
      - name: Audit regression tests
        run: python -m unittest discover -s tests -p 'test_usage*.py'
      - name: Check every currently published package
        run: python -m bangla_dh audit-usage-data --out work/usage-audit
      - name: Build clean features and check current snapshot
        run: |
          python -m bangla_dh build-usage-features --out work/usage-pipeline
          python -m bangla_dh verify-usage-run work/usage-pipeline
      - name: Show audit findings
        if: always()
        run: |
          if [ -f work/usage-audit/REPORT.md ]; then
            cat work/usage-audit/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f work/usage-pipeline/REPORT.md ]; then
            cat work/usage-pipeline/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
